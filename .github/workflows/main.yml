name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip -d src
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          flutter create --platforms=android --org com.vault --project-name vault app
          cp -r src/lib/* app/lib/
          cp src/pubspec.yaml app/pubspec.yaml
          cp -r src/res/* app/android/app/src/main/res/
          sed -i 's/android:label="[^"]*"/android:label="Vault"/' app/android/app/src/main/AndroidManifest.xml
          cd app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: finance-app
          path: app/build/app/outputs/flutter-apk/app-release.apk
